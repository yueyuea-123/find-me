<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Blender 家具资产 8 件同屏验证</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #F5EFE3; overflow: hidden; }
  #c { display: block; width: 100vw; height: 100vh; }
  #s { position: fixed; left: 16px; top: 14px; padding: 8px 12px; background: rgba(255,255,255,.82);
       border-radius: 8px; font-size: 12px; color: #5A5148; line-height: 1.6; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="s">加载中…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/GLTFLoader.js';

const canvas = document.getElementById('c');
const status = document.getElementById('s');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#F5EFE3');

const aspect = innerWidth / innerHeight;
const D = 8.6;
const camera = new THREE.OrthographicCamera(-D * aspect, D * aspect, D, -D, 0.1, 120);
camera.position.set(16, 15, 20);
camera.lookAt(0, 0.3, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8c3a5, 2.1));
const dir = new THREE.DirectionalLight(0xfff6e8, 2.0);
dir.position.set(-6, 14, 8);
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
dir.shadow.camera.left = -16; dir.shadow.camera.right = 16;
dir.shadow.camera.top = 16; dir.shadow.camera.bottom = -16;
dir.shadow.bias = -0.0005;
scene.add(dir);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: '#D9B98C', roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const layout = [
  ['sofa', -5.6, -2.6], ['bed', -1.9, -2.6], ['chair', 1.9, -2.6], ['table', 5.6, -2.6],
  ['coffee', -5.6, 2.6], ['wardrobe', -1.9, 2.6], ['cabinet', 1.9, 2.6], ['shelf', 5.6, 2.6],
];
const loader = new GLTFLoader();
let done = 0; const errors = [];
for (const [key, x, z] of layout) {
  try {
    const gltf = await loader.loadAsync('./assets/furniture_blender/' + key + '.glb');
    const root = gltf.scene;
    root.position.set(x, 0, z);
    root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    scene.add(root);
    done++;
  } catch (e) { errors.push(key + ': ' + e.message); }
  status.textContent = '已加载 ' + done + '/8' + (errors.length ? ' | 失败: ' + errors.join('; ') : '');
}
renderer.render(scene, camera);
window.__ready = true;
</script>
</body>
</html>
